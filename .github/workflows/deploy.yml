name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许工作流把构建产物推送到 gh-pages 分支
permissions:
  contents: write

# 防止并发部署互相覆盖
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # 不声明自定义域：博客用户站 bbb-pro.github.io 已绑定 057300.xyz，
          # GitHub 会将该自定义域自动应用到其下全部项目站，本站因此在
          # https://057300.xyz/label-editor/ 下访问。
          # 若在此声明 apex 域 057300.xyz，会与用户站争夺同一域名
          # （GitHub 侧报 CNAME already taken），存在部署中断风险。
          # 每次部署重建干净的 gh-pages 分支
          force_orphan: true
